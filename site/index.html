<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Checklist web</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#5f5f58; --card:#fff; --line:#dcdcd3; --accent:#0b6b4f; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161614; --fg:#ecece6; --muted:#a2a29a; --card:#20201d; --line:#3a3a35; --accent:#4cc79b; --accent-fg:#06281d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.5rem; margin:8px 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-bottom:12px; }
  .bar label { display:flex; flex-direction:column; font-size:.85rem; color:var(--muted); gap:2px; flex:1 1 180px; }
  input[type=text], select { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); min-height:44px; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; min-height:44px; }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .total { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:1; }
  progress { width:100%; height:10px; accent-color:var(--accent); }
  details { background:var(--card); border:1px solid var(--line); border-radius:8px; margin:8px 0; }
  summary { cursor:pointer; padding:12px; font-weight:600; display:flex; justify-content:space-between; gap:8px; min-height:44px; }
  summary .n { color:var(--muted); font-weight:400; white-space:nowrap; }
  ul { list-style:none; margin:0; padding:0 12px 8px; }
  li label { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); cursor:pointer; align-items:flex-start; }
  li input { width:22px; height:22px; margin-top:2px; flex:none; accent-color:var(--accent); }
  li input:checked + span { color:var(--muted); text-decoration:line-through; }
  code { background:color-mix(in srgb, var(--fg) 10%, transparent); padding:1px 5px; border-radius:4px; font-size:.9em; }
  li textarea { display:block; width:100%; margin:0 0 4px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); min-height:44px; resize:vertical; }
  li textarea[hidden] { display:none; }
  li button.note { font-size:.85rem; color:var(--muted); margin:0 0 6px 32px; padding:4px 10px; }
  .msg { color:var(--muted); font-size:.9rem; min-height:1.4em; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <h1>Checklist web</h1>
  <p class="sub">Source : <code>CHECKLIST.md</code>. Les cases cochées sont enregistrées par projet dans Directus (copie de secours dans ce navigateur).</p>

  <div class="bar">
    <label>Mes checklists
      <select id="ouvrir"><option value="">Ouvrir une checklist…</option></select>
    </label>
    <button id="nouvelle" type="button">Nouvelle</button>
  </div>
  <div class="bar">
    <label>Nom du projet
      <input type="text" id="projet" placeholder="mon-projet" autocomplete="off" list="projets">
      <datalist id="projets"></datalist>
    </label>
    <label>Type de projet
      <select id="type">
        <option value="tous">Tous</option>
        <option value="statique">Site statique</option>
        <option value="cms">Statique + CMS headless</option>
        <option value="spa">SPA + BaaS</option>
        <option value="ssr">SSR / API</option>
      </select>
    </label>
    <button id="export" class="primary" type="button">Exporter en Markdown</button>
    <button id="import" type="button">Importer un Markdown</button>
    <input type="file" id="fichier" accept=".md,text/markdown,text/plain" hidden>
    <button id="reset" type="button">Réinitialiser</button>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div class="total">
    <progress id="total" max="1" value="0" aria-label="Progression totale"></progress>
    <div class="msg" id="totalTxt"></div>
  </div>

  <div id="liste">Chargement…</div>
  <noscript>Cette page demande JavaScript. Le contenu est dans CHECKLIST.md.</noscript>
</main>

<script>
const $ = (id) => document.getElementById(id)
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
  del(k) { try { localStorage.removeItem(k) } catch {} },
}
const ALL = ['statique', 'cms', 'spa', 'ssr']
let sections = []
let checked = {}
let notes = {} // { id: "texte" }, une note par case

function parse(md) {
  const out = []
  let cur = null, last = null
  for (const line of md.split(/\r?\n/)) {
    let m = line.match(/^## (\d+)\. (.+)$/)
    if (m) { cur = { num: m[1], title: m[2], types: ALL, items: [] }; out.push(cur); last = null; continue }
    if (!cur) continue
    // Lignes indentées sous une case = sa note (avec ou sans `>`)
    m = last && line.match(/^(?: {2,}|\t)\s*(?:> ?)?(.*)$/)
    if (m) { if (m[1].trim()) last.note = last.note ? last.note + '\n' + m[1].trim() : m[1].trim(); continue }
    last = null
    m = line.match(/^<!-- types: (.+) -->$/)
    if (m) { cur.types = m[1].split(',').map((s) => s.trim()); continue }
    m = line.match(/^- \[([ x])\] (.+?)(?: <!-- ([a-z,]+) -->)?$/)
    if (m) {
      const id = cur.num + '.' + (cur.items.length + 1)
      last = { id, text: m[2], done: m[1] === 'x', types: m[3] ? m[3].split(',') : cur.types, note: '' }
      cur.items.push(last)
    }
  }
  return out
}

// `code` et **gras** sans innerHTML
function inline(parent, text) {
  for (const part of text.split(/(`[^`]+`|\*\*[^*]+\*\*)/)) {
    if (!part) continue
    if (part[0] === '`') { const c = document.createElement('code'); c.textContent = part.slice(1, -1); parent.append(c) }
    else if (part.startsWith('**')) { const b = document.createElement('strong'); b.textContent = part.slice(2, -2); parent.append(b) }
    else parent.append(part)
  }
}

const nom = () => $('projet').value.trim() || 'sans-nom'
const key = () => 'web-checklist:' + nom()
const type = () => $('type').value
const visible = (item) => type() === 'tous' || item.types.includes(type())

// Directus via api.php (le jeton reste côté serveur). localStorage garde la
// copie locale : hors ligne, ou en local avec `npx serve` où api.php n'existe pas.
// remoteOk : on n'écrase Directus que si on a pu le lire d'abord pour ce projet.
let remoteOk = false
let timer, pending

function load() {
  try { checked = JSON.parse(store.get(key()) || '{}') } catch { checked = {} }
  try { notes = JSON.parse(store.get(key() + ':notes') || '{}') } catch { notes = {} }
  return pull()
}

async function pull() {
  const n = nom()
  remoteOk = false
  try {
    const r = await fetch('api.php?projet=' + encodeURIComponent(n))
    const d = await r.json() // du HTML (serveur sans PHP) lève ici
    if (n !== nom()) return // projet changé pendant l'attente
    if (r.status === 404 && d.error === 'inconnu') {
      remoteOk = true // nouveau projet : on envoie ce qui est déjà coché ici
      if (Object.keys(checked).length || Object.keys(notes).length) push(body())
    } else if (r.ok) {
      checked = d.checked || {}
      notes = d.notes || {}
      if ([...$('type').options].some((o) => o.value === d.type)) $('type').value = d.type
      store.set(key(), JSON.stringify(checked))
      store.set(key() + ':notes', JSON.stringify(notes))
      remoteOk = true
      render()
    } else throw new Error(r.status)
  } catch { say('Synchro indisponible : enregistré dans ce navigateur seulement.') }
}

const body = () => JSON.stringify({ nom: nom(), type: type(), checked, notes })

async function push(b) {
  if (!remoteOk) return
  try {
    const r = await fetch('api.php', { method: 'POST', body: b })
    if (!r.ok) throw new Error(r.status)
    chargerListe()
  } catch { say('Synchro échouée : enregistré dans ce navigateur seulement.') }
}

function save() {
  store.set(key(), JSON.stringify(checked))
  store.set(key() + ':notes', JSON.stringify(notes))
  pending = body()
  clearTimeout(timer)
  timer = setTimeout(flush, 400)
}
function flush() {
  clearTimeout(timer)
  if (pending) push(pending)
  pending = null
}

function render() {
  const root = $('liste')
  const open = new Set([...root.querySelectorAll('details[open]')].map((d) => d.dataset.num))
  root.replaceChildren()
  let done = 0, count = 0
  for (const s of sections) {
    const items = s.items.filter(visible)
    if (!items.length) continue
    const d = document.createElement('details')
    d.dataset.num = s.num
    if (open.has(s.num) || !open.size) d.open = true
    const sum = document.createElement('summary')
    const t = document.createElement('span'); t.textContent = s.num + '. ' + s.title
    const n = document.createElement('span'); n.className = 'n'
    const nd = items.filter((i) => checked[i.id]).length
    n.textContent = nd + '/' + items.length
    sum.append(t, n); d.append(sum)
    const ul = document.createElement('ul')
    for (const it of items) {
      const li = document.createElement('li')
      const lab = document.createElement('label')
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!checked[it.id]
      cb.addEventListener('change', () => { checked[it.id] = cb.checked; if (!cb.checked) delete checked[it.id]; save(); render() })
      const sp = document.createElement('span'); inline(sp, it.text)
      lab.append(cb, sp); li.append(lab)
      const ta = document.createElement('textarea'); ta.rows = 2; ta.value = notes[it.id] || ''; ta.hidden = !ta.value
      ta.setAttribute('aria-label', 'Note : ' + it.text)
      ta.addEventListener('input', () => { const v = ta.value.trim(); if (v) notes[it.id] = v; else delete notes[it.id]; save() })
      const nb = document.createElement('button'); nb.type = 'button'; nb.className = 'note'
      nb.textContent = ta.value ? 'Modifier la note' : 'Ajouter une note'
      nb.addEventListener('click', () => { if (ta.hidden) { ta.hidden = false; ta.focus() } else if (!ta.value) ta.hidden = true })
      li.append(ta, nb); ul.append(li)
    }
    d.append(ul); root.append(d)
    done += nd; count += items.length
  }
  $('total').max = count || 1; $('total').value = done
  $('totalTxt').textContent = done + ' / ' + count + ' cases'
}

function toMarkdown() {
  const nom = $('projet').value.trim() || 'sans-nom'
  const lignes = ['# Checklist : ' + nom, '', 'Type : ' + $('type').selectedOptions[0].textContent + '. Générée le ' + new Date().toLocaleDateString('fr-CH') + '.', '',
    '<!-- Pour annoter une case, écrire des lignes indentées juste en dessous, par exemple :',
    '- [x] HTTPS forcé',
    '  > fait via Infomaniak',
    'Puis « Importer un Markdown » pour reprendre les cases cochées et les notes. -->', '']
  for (const s of sections) {
    const items = s.items.filter(visible)
    if (!items.length) continue
    lignes.push('## ' + s.num + '. ' + s.title)
    for (const it of items) {
      lignes.push('- [' + (checked[it.id] ? 'x' : ' ') + '] ' + it.text)
      for (const l of (notes[it.id] || '').split('\n')) if (l) lignes.push('  > ' + l)
    }
    lignes.push('')
  }
  return lignes.join('\n')
}

function say(t) { $('msg').textContent = t }

$('export').addEventListener('click', async () => {
  const md = toMarkdown()
  const nom = ($('projet').value.trim() || 'sans-nom').replace(/[^\w.-]+/g, '-')
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }))
  a.download = 'CHECKLIST-' + nom + '.md'
  a.click(); URL.revokeObjectURL(a.href)
  try { await navigator.clipboard.writeText(md); say('Exporté et copié dans le presse-papier.') }
  catch { say('Exporté (copie dans le presse-papier non autorisée).') }
})
// Import : on rapproche section + texte (pas l'id, l'export filtre par type).
// Les cases absentes du fichier restent telles quelles.
$('import').addEventListener('click', () => $('fichier').click())
$('fichier').addEventListener('change', async () => {
  const f = $('fichier').files[0]
  $('fichier').value = '' // permet de réimporter le même fichier
  if (!f) return
  const md = await f.text()
  const ids = new Map(sections.flatMap((s) => s.items.map((it) => [s.num + '|' + it.text, it.id])))
  const lus = parse(md).flatMap((s) => s.items.map((it) => ({ id: ids.get(s.num + '|' + it.text), done: it.done, note: it.note })))
  const connus = lus.filter((l) => l.id)
  if (!connus.length) return say('Aucune case reconnue dans ce fichier.')
  const cible = md.match(/^# Checklist : (.+)$/m)?.[1].trim() || nom()
  const libelle = md.match(/^Type : (.+?)\./m)?.[1]
  const opt = [...$('type').options].find((o) => o.textContent === libelle)
  const nbNotes = connus.filter((l) => l.note).length
  if (!confirm('Importer ' + connus.filter((l) => l.done).length + ' cases cochées et ' + nbNotes + ' notes dans « ' + cible + ' » ?')) return
  if (cible !== $('projet').value.trim()) await ouvrir(cible)
  if (opt) { $('type').value = opt.value; store.set('web-checklist:type', opt.value) }
  for (const l of connus) {
    if (l.done) checked[l.id] = true; else delete checked[l.id]
    if (l.note) notes[l.id] = l.note // pas de note dans le fichier : on garde celle d'ici
  }
  save(); render()
  say('Importé : ' + connus.length + ' cases lues, ' + nbNotes + ' notes, ' + (lus.length - connus.length) + ' non reconnues.')
})
$('reset').addEventListener('click', () => {
  if (!confirm('Décocher toutes les cases de ce projet ?')) return
  checked = {}; save(); render(); say('Projet réinitialisé.')
})
// Seule voie de navigation entre projets : champ nom, liste, bouton Nouvelle, hash d'URL.
function ouvrir(n) {
  flush()
  $('projet').value = n
  store.set('web-checklist:dernier', n)
  const h = n ? '#p=' + encodeURIComponent(n) : ''
  if (location.hash !== h) history.pushState(null, '', h || location.pathname + location.search)
  $('ouvrir').value = [...$('ouvrir').options].some((o) => o.value === n) ? n : ''
  const p = load(); render()
  return p
}
const hashNom = () => { const m = location.hash.match(/^#p=(.+)$/); return m ? decodeURIComponent(m[1]) : null }

async function chargerListe() {
  try {
    const l = await (await fetch('api.php')).json()
    if (!Array.isArray(l)) return
    const libelle = (t) => [...$('type').options].find((o) => o.value === t)?.textContent
    $('projets').replaceChildren(...l.map((p) => Object.assign(document.createElement('option'), { value: p.nom })))
    $('ouvrir').replaceChildren(
      Object.assign(document.createElement('option'), { value: '', textContent: l.length ? 'Ouvrir une checklist…' : 'Aucune checklist enregistrée' }),
      ...l.map((p) => Object.assign(document.createElement('option'), {
        value: p.nom,
        textContent: [p.nom, libelle(p.type), p.coches + ' cases'].filter(Boolean).join(' · '),
      })),
    )
    $('ouvrir').value = l.some((p) => p.nom === nom()) ? nom() : ''
  } catch {}
}

$('projet').addEventListener('change', () => ouvrir($('projet').value.trim()))
$('ouvrir').addEventListener('change', () => { if ($('ouvrir').value) ouvrir($('ouvrir').value) })
$('nouvelle').addEventListener('click', () => { ouvrir(''); $('projet').focus() })
window.addEventListener('popstate', () => { const n = hashNom(); ouvrir(n ?? '') })
$('type').addEventListener('change', () => { store.set('web-checklist:type', type()); render() })

$('projet').value = hashNom() ?? store.get('web-checklist:dernier') ?? ''
$('type').value = store.get('web-checklist:type') || 'tous'

chargerListe()

fetch('CHECKLIST.md')
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.text() })
  .then((md) => { sections = parse(md); load(); render() })
  .catch(() => { $('liste').textContent = 'Impossible de charger CHECKLIST.md. Lancer un serveur local : npx serve site' })
</script>
</body>
</html>
